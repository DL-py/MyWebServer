<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>注册</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="page">
		<section class="card card--wide">
			<h1 class="title">注册</h1>
			<p class="subtitle">填写下面的信息完成注册</p>
			<form class="form" action="register.cgi" method="POST">
				<div class="field">
					<label for="user">账号</label>
					<input class="input" type="text" id="user" name="user" maxlength="11" autocomplete="username" required>
				</div>
				<div class="field">
					<label for="password">密码</label>
					<input class="input" type="password" id="password" name="password" autocomplete="new-password" required>
				</div>
				<div class="grid">
					<div class="field">
						<label for="hobby">爱好</label>
						<select class="input" id="hobby" name="hobby">
							<option value="运动">运动</option>
							<option value="唱歌">唱歌</option>
							<option value="玩游戏">玩游戏</option>
							<option value="学习">学习</option>
						</select>
					</div>
					<div class="field">
						<label for="sex">性别</label>
						<select class="input" id="sex" name="sex">
							<option value="boy">男</option>
							<option value="girl">女</option>
						</select>
					</div>
				</div>
				<div class="field">
					<label for="introduction">自我介绍</label>
					<textarea class="input" id="introduction" name="introduction" rows="5"></textarea>
				</div>
				<div class="field">
					<label for="address">地址</label>
					<select class="input" id="address" name="address">
						<option value="北京">北京</option>
						<option value="四川">四川</option>
						<option value="上海">上海</option>
						<option value="武汉">武汉</option>
					</select>
				</div>
				<div class="actions">
					<button class="btn btn--primary" type="submit">提交</button>
					<button class="btn btn--secondary" type="reset">重置</button>
				</div>
			</form>
			<p class="footer-link">已有账号？<a href="login.html">去登录</a></p>
		</section>
	</main>
</body>
</html>
